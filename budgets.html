<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budgets | Pennywisely</title>
<meta name="description" content="Set a monthly limit for each category and watch your progress.">
<meta name="author" content="Pennywisely">
<meta name="keywords" content="money tracker, budget, expenses, savings, personal finance">
<meta name="theme-color" content="#0b3b3c">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2040%2040'%3E%3Crect%20width='40'%20height='40'%20rx='10'%20fill='%230b3b3c'/%3E%3Cpath%20d='M13%2031V9h7.5a7.5%207.5%200%200%201%200%2015H13'%20fill='none'%20stroke='%23fff'%20stroke-width='3.2'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='20.5'%20cy='16.5'%20r='2.4'%20fill='%23d4a62a'/%3E%3C/svg%3E">
<!-- Google font, Bootstrap and icons -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Link my css files -->
<link href="assets/css/base.css" rel="stylesheet">
<link href="assets/css/layout.css" rel="stylesheet">
<link href="assets/css/components.css" rel="stylesheet">
<link href="assets/css/pages.css" rel="stylesheet">
<link href="assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="budgets">
<!-- Sidebar, top bar and footer (made in core.js so all pages use the same menu) -->
<div class="app">
  <aside id="nav"></aside>
  <div class="content">
    <header id="top" class="topbar"></header>
    <main class="page" id="main">
      <!-- Page title and button -->
      <div class="page-head"><div><h1>Budgets</h1><p>Set a monthly limit for each category and watch your progress.</p></div><div class="actions"><button class="btn btn-outline-secondary" id="ebReset"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset limits</button></div></div>
      <!-- Budget summary -->
      <section class="grid cols-3" id="bSummary" aria-label="Budget summary"></section>
      <!-- Budget categories -->
      <section class="grid cards" id="bGrid" aria-label="Budget categories"></section>
      <!-- Budget versus spent chart -->
      <section class="card" aria-label="Budget versus spent chart"><div class="card-head"><div><h2>Budget vs spent</h2><p>Green is within limit, red is over</p></div></div><div class="chart-box"><canvas id="budgetChart" role="img" aria-label="Budget versus spent by category"></canvas></div></section>
    </main>
    <footer id="foot" class="pw-foot"></footer>
  </div>
</div>
<!-- Modal: edit one budget limit -->
<div class="modal fade" id="editBudget" tabindex="-1" aria-labelledby="ebTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="ebForm" novalidate>
  <div class="modal-header"><h5 class="modal-title" id="ebTitle">Edit budget</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><div id="ebErr" class="alert alert-danger py-2 d-none" role="alert"></div><label class="form-label fw-semibold" for="ebAmt">Monthly limit (RM)</label><input class="form-control" id="ebAmt" type="number" min="1" step="0.01" inputmode="decimal"></div>
  <div class="modal-footer"><button class="btn btn-ink" type="submit">Save limit</button></div></form></div></div>
<!-- Bootstrap and Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<!-- My javascript files -->
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/budgets.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goals &amp; Bills | Pennywisely</title>
<meta name="description" content="Save towards what matters and never miss a payment.">
<meta name="author" content="Pennywisely">
<meta name="keywords" content="money tracker, budget, expenses, savings, personal finance">
<meta name="theme-color" content="#0b3b3c">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2040%2040'%3E%3Crect%20width='40'%20height='40'%20rx='10'%20fill='%230b3b3c'/%3E%3Cpath%20d='M13%2031V9h7.5a7.5%207.5%200%200%201%200%2015H13'%20fill='none'%20stroke='%23fff'%20stroke-width='3.2'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='20.5'%20cy='16.5'%20r='2.4'%20fill='%23d4a62a'/%3E%3C/svg%3E">
<!-- Google font, Bootstrap and icons -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Link my css files -->
<link href="assets/css/base.css" rel="stylesheet">
<link href="assets/css/layout.css" rel="stylesheet">
<link href="assets/css/components.css" rel="stylesheet">
<link href="assets/css/pages.css" rel="stylesheet">
<link href="assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="goals">
<!-- Sidebar, top bar and footer (made in core.js so all pages use the same menu) -->
<div class="app">
  <aside id="nav"></aside>
  <div class="content">
    <header id="top" class="topbar"></header>
    <main class="page" id="main">
      <!-- Page title and button -->
      <div class="page-head"><div><h1>Goals &amp; Bills</h1><p>Save towards what matters and never miss a payment.</p></div><div class="actions"><button class="btn btn-ink" data-bs-toggle="modal" data-bs-target="#goalModal"><i class="bi bi-plus-lg me-1"></i>Add new goal</button></div></div>
      <!-- Summary boxes -->
      <section class="grid kpis" id="gKpis" aria-label="Goals summary"></section>
      <div class="insight gold mb-3" id="gAdvice"></div>
      <!-- Savings goals -->
      <div class="section-title"><h2>Savings goals</h2></div>
      <section class="grid cards" id="goalGrid" aria-label="Savings goals"></section>
      <!-- Bills -->
      <div class="section-title"><h2>Recurring bills</h2><div class="tabs" id="billTabs" role="group" aria-label="Filter bills"><button class="active" data-f="all">All</button><button data-f="unpaid">To pay</button><button data-f="paid">Paid</button></div></div>
      <section class="grid split split-8-4" aria-label="Recurring bills">
        <div class="card"><div id="billList"></div><div class="bill-total" id="billTotal"></div></div>
        <div class="card"><div class="card-head"><div><h2>Bill status</h2><p>Where this month’s bill money stands</p></div></div><div class="chart-box sm"><canvas id="billChart" role="img" aria-label="Bills by status"></canvas></div></div>
      </section>
    </main>
    <footer id="foot" class="pw-foot"></footer>
  </div>
</div>
<!-- Modal: add a goal -->
<div class="modal fade" id="goalModal" tabindex="-1" aria-labelledby="gTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="goalForm" novalidate>
  <div class="modal-header"><h5 class="modal-title" id="gTitle">Add new goal</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body form-grid two"><div id="gErr" class="alert alert-danger py-2 d-none mb-0 span-2" role="alert"></div>
    <div class="span-2"><label class="form-label fw-semibold" for="gName">Goal name</label><input class="form-control" id="gName" maxlength="40" placeholder="e.g. Down payment for a house"></div>
    <div class="span-2"><label class="form-label fw-semibold" for="gIcon">Type</label><select class="form-select" id="gIcon"></select></div>
    <div class="span-2"><label class="form-label fw-semibold" for="gTarget">Target amount (RM)</label><input class="form-control" id="gTarget" type="number" min="1" step="0.01" inputmode="decimal" placeholder="e.g. 5000"><div class="chip-row" id="gChips" aria-label="Quick amounts"></div></div>
    <div class="span-2"><label class="form-label fw-semibold" for="gSaved">Already saved (RM)</label><input class="form-control" id="gSaved" type="number" min="0" step="0.01" inputmode="decimal" value="0"></div>
    <div class="dp-wrap"><label class="form-label fw-semibold" for="gFromBtn">Target from</label><input type="hidden" id="gFrom"><button type="button" class="form-control dp-btn" id="gFromBtn" aria-expanded="false" aria-controls="gFromPop"><i class="bi bi-calendar3 me-2"></i><span id="gFromTxt">Pick a date</span></button><div class="dp d-none" id="gFromPop" role="dialog" aria-label="Choose start date"></div></div>
    <div class="dp-wrap"><label class="form-label fw-semibold" for="gUntilBtn">Target until</label><input type="hidden" id="gUntil"><button type="button" class="form-control dp-btn" id="gUntilBtn" aria-expanded="false" aria-controls="gUntilPop"><i class="bi bi-calendar3 me-2"></i><span id="gUntilTxt">Pick a date</span></button><div class="dp d-none" id="gUntilPop" role="dialog" aria-label="Choose end date"></div></div>
    <div class="span-2"><div class="insight gold" id="gPlan" aria-live="polite">Enter an amount and both dates to see what to save each month.</div></div></div>
  <div class="modal-footer"><button class="btn btn-ink" type="submit">Create goal</button></div></form></div></div>
<!-- Modal: add money to a goal -->
<div class="modal fade" id="fundModal" tabindex="-1" aria-labelledby="fTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="fundForm" novalidate>
  <div class="modal-header"><h5 class="modal-title" id="fTitle">Add money</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><div id="fErr" class="alert alert-danger py-2 d-none" role="alert"></div><p class="text-secondary" id="fLeft"></p><label class="form-label fw-semibold" for="fAmt">Amount (RM)</label><input class="form-control" id="fAmt" type="number" min="0.01" step="0.01" inputmode="decimal"></div>
  <div class="modal-footer"><button class="btn btn-ink" type="submit">Add to goal</button></div></form></div></div>
<!-- Bootstrap and Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<!-- My javascript files -->
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/goal-art.js"></script>
<script src="assets/js/pages/goals.js"></script>
</body>
</html>
